<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="portfolio.css">
    <title>My Socials | Justin Patulot</title>
</head>
<body>
    <header id="top">
        <a class="portfolio-logo" href="index.html" aria-label="Justin Patulot, home">
            <img src="assets/poster-logo.svg" alt="" width="1170" height="280">
        </a>
        <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="main-navigation" aria-expanded="false" hidden>
            <img class="menu-open-icon" src="assets/material-menu.svg" alt="">
            <img class="menu-close-icon" src="assets/material-close.svg" alt="">
        </button>
        <nav id="main-navigation" class="center portfolio-nav" aria-label="Main navigation">
            <a href="index.html">home</a>
            <a href="about.html">about me</a>
            <a href="values.html">values &amp; goals</a>
            <a href="work.html">my work</a>
            <a href="socials.html" aria-current="page">my socials!</a>
        </nav>
    </header>

    <main class="portfolio">
        <div class="portfolio-page-heading portfolio-shell">
            <p class="portfolio-kicker">MY SOCIALS</p>
            <h1>my socials!</h1>
            <p>You can find and contact me through these platforms.</p>
        </div>

        <section class="portfolio-section portfolio-shell" aria-labelledby="contact-heading">
            <div class="portfolio-section-heading">
                <h2 id="contact-heading"><span>get in touch.</span></h2>
            </div>
            <div class="portfolio-section-content">
                <ul class="socials-list">
                    <li>
                        <a href="mailto:justin.patulot@ciit.edu.ph" aria-label="Email Justin">
                            <img src="assets/social-email.svg" alt="">
                            <strong>email</strong>
                        </a>
                    </li>
                    <li>
                        <a href="https://signal.me/#eu/MYgg8FYlMVbURRO-iCNAXdU17WE-SLnk9k8DQ97aTX5oW24NOshK9Ki06QbnOjT-" aria-label="Open my Signal profile">
                            <img src="assets/social-signal.svg" alt="">
                            <strong>signal</strong>
                        </a>
                    </li>
                    <li>
                        <a href="https://discord.gg/Qeky5mta" aria-label="Open my Discord invite">
                            <img src="assets/social-discord.svg" alt="">
                            <strong>discord</strong>
                        </a>
                    </li>
                    <li>
                        <a href="https://github.com/elliethecatto" aria-label="Open my GitHub profile">
                            <img src="assets/social-github.svg" alt="">
                            <strong>github</strong>
                        </a>
                    </li>
                </ul>
            </div>
        </section>

        <footer class="portfolio-footer">
            <div class="portfolio-shell">
                <p>justin patulot. / qualification portfolio</p>
            </div>
        </footer>
    </main>

    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute; pointer-events: none;">
        <defs>
            <filter id="grid-warp" x="0%" y="0%" width="100%" height="100%" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                <feFlood flood-color="#808000" result="neutral" />
                <feImage id="grid-warp-map" x="-1000" y="-1000" width="1" height="1" preserveAspectRatio="none" result="local-warp" />
                <feComposite in="local-warp" in2="neutral" operator="over" result="warp-map" />
                <feDisplacementMap id="grid-warp-displacement" in="SourceGraphic" in2="warp-map" scale="0" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>
    <script src="grid-warp.js"></script>
    <script src="menu.js"></script>
</body>
</html>
